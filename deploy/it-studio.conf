# BEGIN VHOST it-studio.loc
# Install: sudo cp deploy/it-studio.conf /etc/httpd/conf/conf.d/it-studio.conf && sudo apachectl -t && sudo systemctl reload httpd
<VirtualHost *:80>
    ServerAdmin webmaster@it-studio.loc
    ServerName it-studio.loc
    ServerAlias www.it-studio.loc
    DocumentRoot "/srv/http/it-studio.loc/public"
    DirectoryIndex index.php index.html

    <Directory "/srv/http/it-studio.loc/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]

        <FilesMatch \.php$>
                SetHandler "proxy:unix:/run/php-fpm/php-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    ErrorLog "/var/log/httpd/it-studio.loc-error_log"
    CustomLog "/var/log/httpd/it-studio.loc-access_log" common
</VirtualHost>
# END VHOST it-studio.loc
